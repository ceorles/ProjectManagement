# Render Blueprint for DLL Library. Step-by-step instructions, including the
# values you must fill in, are in docs/RENDER_DEPLOYMENT_GUIDE.md.
#
# No passwords or keys belong in this file. Values marked `sync: false` are typed
# into the Render dashboard when the Blueprint is created.

databases:
  - name: dll-library-db
    databaseName: dll_library
    user: dll_library
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"

services:
  # Django API. It also runs the 15-minute no-show scheduler, so it must stay awake.
  - type: web
    name: dll-library-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    disk:
      name: dll-library-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        fromDatabase:
          name: dll-library-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # both addresses, e.g. dll-library-api.onrender.com,dll-library.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the frontend's address, e.g. https://dll-library.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # the same value as CORS_ALLOWED_ORIGINS
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      - key: REFRESH_COOKIE_SAMESITE
        value: Lax
      - key: LIBRARY_TIME_ZONE
        value: Asia/Manila
      - key: MEDIA_DIR
        value: /var/data/media
      - key: RESERVATION_SCHEDULER_ENABLED
        value: "True"
      - key: RESERVATION_SCHEDULER_INTERVAL_SECONDS
        value: "30"

  # React PWA.
  - type: web
    name: dll-library
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        value: /api
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # If Render gives the API a different address, change these two rules to match.
      - type: rewrite
        source: /api/*
        destination: https://dll-library-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://dll-library-api.onrender.com/media/*
      # Opening or refreshing any page of the app loads the React application.
      - type: rewrite
        source: /*
        destination: /index.html
